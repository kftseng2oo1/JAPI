<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>高級木質節拍器</title>
<meta name="theme-color" content="#2B1810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
  :root{
    --wood-dark:#241309;
    --wood-mid:#402210;
    --wood-hi:#5a3018;
    --brass:#c9a467;
    --brass-light:#efd9a6;
    --ivory:#f5efe0;
    --ivory-dim:#cfc6ae;
    --accent-red:#a83d3d;
    --beat-glow:#e8b04b;
    --shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%; margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #4a2812 0%, transparent 60%),
      var(--wood-dark);
    color:var(--ivory);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  #app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
  }

  /* ---------- Header ---------- */
  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--brass);
    opacity:.75;
    margin-top:2px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:.02em;
    margin:2px 0 12px;
    color:var(--ivory);
  }

  /* ---------- Pendulum case ---------- */
  .case{
    position:relative;
    width:100%;
    max-width:240px;
    aspect-ratio: 3 / 4;
    background:
      linear-gradient(160deg, var(--wood-hi) 0%, var(--wood-mid) 55%, var(--wood-dark) 100%);
    border-radius: 18px 18px 70px 70px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.06),
      inset 0 -20px 40px rgba(0,0,0,.45),
      0 16px 30px var(--shadow);
    overflow:hidden;
    border:1px solid rgba(0,0,0,.5);
  }
  .case::before{ /* wood grain */
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 1px, transparent 1px, transparent 7px);
    mix-blend-mode:overlay;
    opacity:.5;
  }
  .case-face{
    position:absolute;
    top:10%; left:8%; right:8%; bottom:6%;
    background:
      radial-gradient(circle at 22% 18%, rgba(232,176,74,.16) 0%, transparent 45%),
      radial-gradient(circle at 82% 82%, rgba(168,61,61,.12) 0%, transparent 50%),
      linear-gradient(165deg, #f8f1dc 0%, #ecdfc0 50%, #e2d2a9 100%);
    border-radius: 10px 10px 50px 50px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.35), inset 0 0 0 2px rgba(0,0,0,.15);
    overflow:hidden;
  }
  .face-glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 32%, var(--beat-glow) 0%, transparent 62%);
    opacity:0;
    pointer-events:none;
    z-index:0;
    transition: opacity .12s ease-out;
  }
  .face-glow.accent{
    background: radial-gradient(circle at 50% 32%, var(--accent-red) 0%, transparent 62%);
  }

  .notes{ position:absolute; inset:0; z-index:1; }
  .note{
    position:absolute;
    font-size:30px;
    opacity:.55;
    pointer-events:none;
  }
  .note .note-inner{ display:inline-block; }
  .note.n1{ top:12%; left:14%; color:var(--brass); font-size:32px; }
  .note.n2{ top:64%; left:70%; color:var(--accent-red); font-size:34px; }
  .note.n3{ top:40%; left:76%; color:var(--beat-glow); font-size:26px; }
  .note.n4{ top:74%; left:15%; color:var(--brass); font-size:28px; }

  .scale{
    position:absolute; left:50%; top:8%; bottom:4%;
    width:2px; transform:translateX(-50%);
    z-index:1;
  }
  .tick{
    position:absolute; left:50%;
    width:1px; height:8px;
    background:rgba(80,60,30,.35);
    transform-origin:top center;
  }
  .tick.major{ height:12px; width:1.5px; background:rgba(80,60,30,.55);}

  .arm{
    position:absolute;
    left:50%; top:11%;
    width:4px; height:82%;
    background:linear-gradient(180deg, var(--brass) 0%, #8f7038 100%);
    border-radius:2px;
    transform-origin: top center;
    transform: translateX(-50%) rotate(0deg);
    box-shadow:0 0 4px rgba(0,0,0,.3);
  }
  .weight{
    position:absolute;
    left:50%; top:36%;
    width:22px; height:15px;
    background: radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 55%, #7a5e2c 100%);
    border-radius:4px;
    transform:translate(-50%,-50%);
    box-shadow:0 2px 5px rgba(0,0,0,.4);
    transition: top .15s ease;
  }
  .bob{
    position:absolute;
    left:50%; bottom:-3%;
    width:15px; height:15px;
    background: radial-gradient(circle at 35% 30%, var(--accent-red) 0%, #6e2626 100%);
    border-radius:50%;
    transform:translateX(-50%);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .pivot-cap{
    position:absolute; left:50%; top:11%;
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--ivory), #8a7a54);
    transform:translate(-50%,-50%);
    box-shadow:0 1px 3px rgba(0,0,0,.5);
    z-index:2;
  }

  .arm.swinging{ animation: swing linear infinite; }
  @keyframes swing{
    0%{ transform: translateX(-50%) rotate(-24deg); }
    50%{ transform: translateX(-50%) rotate(24deg); }
    100%{ transform: translateX(-50%) rotate(-24deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .arm.swinging{ animation: none; }
  }

  /* ---------- BPM readout ---------- */
  .bpm-wrap{
    display:flex; align-items:baseline; justify-content:center;
    gap:10px; margin-top:16px;
  }
  .bpm-btn{
    width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(201,164,103,.4);
    background:rgba(255,255,255,.03);
    color:var(--brass-light);
    font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .bpm-btn:active{ background:rgba(201,164,103,.2); transform:scale(.94); }
  
  .bpm-display-container{
    position:relative;
    text-align:center;
  }
  .bpm-num{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:54px;
    min-width:140px;
    text-align:center;
    letter-spacing:-.01em;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    border-bottom: 2px dashed rgba(201,164,103,0.4);
    transition: color 0.2s;
  }
  .bpm-num:hover{ color: var(--brass-light); }
  
  .bpm-input-field{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 42px;
    width: 130px;
    background: var(--wood-dark);
    color: var(--ivory);
    border: 2px solid var(--brass);
    border-radius: 8px;
    text-align: center;
    display: none;
    z-index: 10;
  }
  .bpm-input-field:focus { outline: none; }

  .bpm-label{
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--ivory-dim); text-align:center; margin-top:-2px;
  }

  input[type=range]{
    width:100%; margin-top:12px;
    -webkit-appearance:none; appearance:none;
    height:4px; border-radius:2px;
    background:rgba(255,255,255,.15);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass));
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    margin-top:-7px;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:2px;
  }

  /* ---------- Beat indicator ---------- */
  .beats{
    display:flex; gap:8px; margin-top:14px; min-height:16px; justify-content:center;
  }
  .beat-dot{
    width:12px; height:12px; border-radius:50%;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.15);
  }
  .beat-dot.accent{ border-color:rgba(232,176,74,.5); }
  .beat-dot.on{
    background:var(--beat-glow);
    box-shadow:0 0 10px var(--beat-glow);
    transform:scale(1.2);
  }
  .beat-dot.accent.on{
    background:var(--accent-red);
    box-shadow:0 0 12px var(--accent-red);
  }

  /* ---------- Controls row ---------- */
  .row{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-top:14px; width:100%;
    flex-wrap: wrap;
  }
  select{
    -webkit-appearance:none; appearance:none;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(201,164,103,.35);
    color:var(--ivory);
    padding:8px 12px; border-radius:8px;
    font-size:13px;
  }
  .tap-btn{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(201,164,103,.35);
    color:var(--ivory);
    padding:8px 14px; border-radius:8px;
    font-size:13px; cursor:pointer;
  }
  .tap-btn:active{ background:rgba(201,164,103,.2); }

  .main-ctrl-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 16px;
  }

  .timer-display{
    margin-top:10px;
    font-variant-numeric: tabular-nums;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--brass-light);
    opacity:0;
    height:0;
    overflow:hidden;
    transition: opacity .2s ease;
  }
  .timer-display.active{
    opacity:1;
    height:auto;
  }
  .timer-display.ending{
    color:var(--accent-red);
  }

  .play-btn{
    width:72px; height:72px; border-radius:50%;
    border:none;
    background: radial-gradient(circle at 35% 30%, var(--accent-red) 0%, #6e2626 70%);
    box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .play-btn:active{ transform:scale(.96); }
  .play-btn svg{ width:26px; height:26px; fill:var(--ivory); }

  .vol-row{
    display:flex; align-items:center; gap:10px;
    width:100%; margin-top:14px; opacity:.85;
  }
  .vol-row svg{ width:15px; height:15px; fill:var(--ivory-dim); flex-shrink:0; }
  .vol-row input{ margin-top:0; }

  footer{
    margin-top:auto;
    padding-top:16px;
    font-size:10px;
    letter-spacing:.1em;
    color:rgba(245,239,224,.3);
    text-align:center;
  }
</style>
</head>
<body>
<div id="app">
  <div class="eyebrow">METRONOME · 節拍器</div>
  <h1>精緻木質節拍器</h1>

  <div class="case">
    <div class="case-face">
      <div class="face-glow" id="faceGlow"></div>
      <div class="notes">
        <span class="note n1" id="note1"><span class="note-inner">♪</span></span>
        <span class="note n2" id="note2"><span class="note-inner">♫</span></span>
        <span class="note n3" id="note3"><span class="note-inner">♬</span></span>
        <span class="note n4" id="note4"><span class="note-inner">♩</span></span>
      </div>
      <div class="scale" id="scale"></div>
    </div>
    <div class="arm" id="arm">
      <div class="weight" id="weight"></div>
      <div class="bob"></div>
    </div>
    <div class="pivot-cap"></div>
  </div>

  <div class="bpm-wrap">
    <div class="bpm-btn" id="bpmDown">–</div>
    <div class="bpm-display-container">
      <div class="bpm-num" id="bpmNum" title="點擊直接輸入數字">120</div>
      <input type="tel" id="bpmInput" class="bpm-input-field" min="40" max="240" value="120" inputmode="numeric" pattern="[0-9]*" aria-label="輸入 BPM 數值">
      <div class="bpm-label">BPM</div>
    </div>
    <div class="bpm-btn" id="bpmUp">+</div>
  </div>

  <input type="range" id="bpmSlider" min="40" max="240" value="120">

  <div class="beats" id="beats"></div>

  <div class="row">
    <select id="beatsPerBar" aria-label="拍號選擇">
      <option value="2">2/4 拍</option>
      <option value="3">3/4 拍</option>
      <option value="4" selected>4/4 拍</option>
      <option value="6">6/8 拍</option>
    </select>
    <select id="soundStyle" aria-label="音色選擇">
      <option value="wood" selected>木魚音色</option>
      <option value="beep">電子嗶聲</option>
      <option value="bell">清脆鈴音</option>
    </select>
    <select id="timerSelect" aria-label="定時練習時長">
      <option value="0" selected>不限時</option>
      <option value="300">5 分鐘</option>
      <option value="600">10 分鐘</option>
      <option value="900">15 分鐘</option>
      <option value="1200">20 分鐘</option>
      <option value="1800">30 分鐘</option>
    </select>
    <button class="tap-btn" id="tapBtn">點按抓拍</button>
  </div>

  <div class="timer-display" id="timerDisplay"></div>

  <div class="main-ctrl-row">
    <button class="play-btn" id="playBtn" aria-label="開始/暫停">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <div class="vol-row">
    <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" id="volSlider" min="0" max="100" value="70">
  </div>

  <footer>進階觸控版 · 支援空白鍵與方向鍵操作</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- State ----------
  let bpm = 120;
  let beatsPerBar = 4;
  let isPlaying = false;
  let volume = 0.7;
  let currentBeat = 0;
  let soundStyle = 'wood'; // 'wood', 'beep', 'bell'
  let timerDuration = 0; // seconds; 0 = unlimited
  let timerRemaining = 0;
  let timerIntervalId = null;

  // ---------- Elements ----------
  const bpmNum = document.getElementById('bpmNum');
  const bpmInput = document.getElementById('bpmInput');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmDown = document.getElementById('bpmDown');
  const bpmUp = document.getElementById('bpmUp');
  const beatsSelect = document.getElementById('beatsPerBar');
  const soundSelect = document.getElementById('soundStyle');
  const timerSelect = document.getElementById('timerSelect');
  const timerDisplay = document.getElementById('timerDisplay');
  const tapBtn = document.getElementById('tapBtn');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const arm = document.getElementById('arm');
  const weight = document.getElementById('weight');
  const beatsWrap = document.getElementById('beats');
  const volSlider = document.getElementById('volSlider');
  const scaleEl = document.getElementById('scale');
  const faceGlow = document.getElementById('faceGlow');
  const notes = document.querySelectorAll('.note');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Haptic helper ----------
  function triggerHaptic(duration = 10){
    if(navigator.vibrate){
      try { navigator.vibrate(duration); } catch(e){}
    }
  }

  // ---------- Persisted settings ----------
  try{
    const saved = JSON.parse(localStorage.getItem('metronome-advanced-settings') || '{}');
    if(saved.bpm) bpm = saved.bpm;
    if(saved.beatsPerBar) beatsPerBar = saved.beatsPerBar;
    if(typeof saved.volume === 'number') volume = saved.volume;
    if(saved.soundStyle) soundStyle = saved.soundStyle;
    if(typeof saved.timerDuration === 'number') timerDuration = saved.timerDuration;
  }catch(e){}

  function saveSettings(){
    try{
      localStorage.setItem('metronome-advanced-settings', JSON.stringify({bpm, beatsPerBar, volume, soundStyle, timerDuration}));
    }catch(e){}
  }

  // ---------- Scale ticks ----------
  (function buildScale(){
    const positions = [10,20,30,40,50,60,70,80,90];
    positions.forEach((p,i)=>{
      const t = document.createElement('div');
      t.className = 'tick' + (i % 2 === 0 ? ' major' : '');
      t.style.top = p + '%';
      scaleEl.appendChild(t);
    });
  })();

  // ---------- Beat dots ----------
  function buildBeatDots(){
    beatsWrap.innerHTML = '';
    for(let i=0;i<beatsPerBar;i++){
      const d = document.createElement('div');
      d.className = 'beat-dot' + (i===0 ? ' accent' : '');
      beatsWrap.appendChild(d);
    }
  }
  buildBeatDots();

  let noteIndex = 0;
  function lightBeat(idx){
    const dots = beatsWrap.children;
    Array.from(dots).forEach(d=>d.classList.remove('on'));
    if(dots[idx]) dots[idx].classList.add('on');

    const accent = idx === 0;
    faceGlow.classList.toggle('accent', accent);
    faceGlow.style.opacity = accent ? '0.6' : '0.3';
    setTimeout(()=>{ faceGlow.style.opacity = '0'; }, 80);

    // Use Web Animations API instead of forcing offsetWidth reflow
    const note = notes[noteIndex % notes.length];
    noteIndex++;
    if(note.animate && !prefersReducedMotion){
      note.animate([
        { transform: 'scale(1) translateY(0)', opacity: 0.55 },
        { transform: 'scale(1.8) translateY(-16px)', opacity: 1 },
        { transform: 'scale(1) translateY(0)', opacity: 0.55 }
      ], { duration: 400, easing: 'ease-out' });
    }
  }

  // ---------- UI sync ----------
  function updateBpmUI(){
    bpmNum.textContent = bpm;
    bpmInput.value = bpm;
    bpmSlider.value = bpm;
    const cycleSeconds = (60 / bpm) * 2;
    arm.style.animationDuration = cycleSeconds + 's';
    const t = (bpm - 40) / (240 - 40);
    weight.style.top = (25 + (1-t) * 35) + '%';
  }
  updateBpmUI();
  beatsSelect.value = String(beatsPerBar);
  soundSelect.value = soundStyle;
  timerSelect.value = String(timerDuration);
  volSlider.value = Math.round(volume*100);

  function setBpm(newBpm){
    bpm = Math.max(40, Math.min(240, Math.round(newBpm)));
    updateBpmUI();
    if(isPlaying) restartScheduler();
    saveSettings();
  }

  // Direct BPM text input handling
  bpmNum.addEventListener('click', ()=>{
    bpmInput.style.display = 'block';
    bpmInput.focus();
    bpmInput.select();
  });

  bpmInput.addEventListener('blur', ()=>{
    finishBpmInput();
  });

  bpmInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      finishBpmInput();
    }
  });

  function finishBpmInput(){
    const val = parseInt(bpmInput.value, 10);
    if(!isNaN(val)){
      setBpm(val);
    }
    bpmInput.style.display = 'none';
  }

  bpmDown.addEventListener('click', ()=> { triggerHaptic(8); setBpm(bpm - 1); });
  bpmUp.addEventListener('click', ()=> { triggerHaptic(8); setBpm(bpm + 1); });
  bpmSlider.addEventListener('input', (e)=> setBpm(parseInt(e.target.value,10)));

  beatsSelect.addEventListener('change', (e)=>{
    beatsPerBar = parseInt(e.target.value,10);
    currentBeat = 0;
    buildBeatDots();
    saveSettings();
    triggerHaptic(12);
  });

  soundSelect.addEventListener('change', (e)=>{
    soundStyle = e.target.value;
    saveSettings();
    triggerHaptic(10);
  });

  timerSelect.addEventListener('change', (e)=>{
    timerDuration = parseInt(e.target.value, 10);
    saveSettings();
    triggerHaptic(10);
  });

  volSlider.addEventListener('input', (e)=>{
    volume = parseInt(e.target.value,10)/100;
    saveSettings();
  });

  // ---------- Tap tempo ----------
  let tapTimes = [];
  tapBtn.addEventListener('click', ()=>{
    triggerHaptic(15);
    const now = performance.now();
    tapTimes = tapTimes.filter(t => now - t < 2200);
    tapTimes.push(now);
    if(tapTimes.length >= 2){
      const intervals = [];
      for(let i=1;i<tapTimes.length;i++) intervals.push(tapTimes[i]-tapTimes[i-1]);
      const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      const newBpm = 60000/avg;
      setBpm(newBpm);
    }
    tapBtn.textContent = '● ' + bpm;
    clearTimeout(tapBtn._t);
    tapBtn._t = setTimeout(()=>{ tapBtn.textContent = '點按抓拍'; }, 1200);
  });

  // ---------- Audio (Web Audio scheduler) ----------
  let audioCtx = null;
  let nextNoteTime = 0;
  let schedulerTimer = null;
  let schedAheadTime = 0.1;
  let lookaheadMs = 25;
  let beatInScheduler = 0;

  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }

  function playAccentPing(time){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2637, time); // E7, sits above every style's base tone
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(Math.max(volume, 0.001) * 0.35, time + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.09);
  }

  function playSound(time, accent){
    if(volume <= 0) return;
    const effectiveVol = Math.max(volume, 0.001);

    if(accent) playAccentPing(time);

    if(soundStyle === 'wood'){
      // Woodblock sound simulation using filtered noise/sine combo or high-Q oscillators
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(accent ? 880 : 660, time);
      osc.frequency.exponentialRampToValueAtTime(120, time + 0.03);
      
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(effectiveVol, time + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.05);

    } else if(soundStyle === 'bell'){
      // Bell sound
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(accent ? 2093 : 1567, time); // C7 or G6
      
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(effectiveVol * 0.8, time + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.16);

    } else {
      // Classic Beep
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = accent ? 1500 : 1000;
      
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(effectiveVol, time + 0.001);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.06);
    }
  }

  function scheduleNote(beatIndex, time){
    playSound(time, beatIndex === 0);
    const delay = (time - audioCtx.currentTime) * 1000;
    setTimeout(()=>{
      currentBeat = beatIndex;
      lightBeat(beatIndex);
    }, Math.max(0, delay));
  }

  function scheduler(){
    while(nextNoteTime < audioCtx.currentTime + schedAheadTime){
      scheduleNote(beatInScheduler, nextNoteTime);
      const secondsPerBeat = 60.0 / bpm;
      nextNoteTime += secondsPerBeat;
      beatInScheduler = (beatInScheduler + 1) % beatsPerBar;
    }
    schedulerTimer = setTimeout(scheduler, lookaheadMs);
  }

  function startScheduler(){
    ensureAudio();
    beatInScheduler = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
  }

  function stopScheduler(){
    clearTimeout(schedulerTimer);
    schedulerTimer = null;
  }

  function restartScheduler(){
    stopScheduler();
    startScheduler();
  }

  // ---------- Practice timer ----------
  function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateTimerDisplay(){
    timerDisplay.textContent = '剩餘時間 ' + formatTime(timerRemaining);
    timerDisplay.classList.toggle('ending', timerRemaining <= 10);
  }

  function startTimer(){
    if(timerDuration <= 0) return;
    timerRemaining = timerDuration;
    updateTimerDisplay();
    timerDisplay.classList.add('active');
    clearInterval(timerIntervalId);
    timerIntervalId = setInterval(()=>{
      timerRemaining -= 1;
      if(timerRemaining <= 0){
        stop();
        triggerHaptic(40);
        return;
      }
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerIntervalId);
    timerIntervalId = null;
    timerDisplay.classList.remove('active','ending');
  }

  // ---------- Play / stop ----------
  function start(){
    isPlaying = true;
    ensureAudio();
    startScheduler();
    startTimer();
    arm.classList.add('swinging');
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    playBtn.setAttribute('aria-label','暫停');
    triggerHaptic(20);
  }

  function stop(){
    isPlaying = false;
    stopScheduler();
    stopTimer();
    arm.classList.remove('swinging');
    arm.style.transform = 'translateX(-50%) rotate(0deg)';
    Array.from(beatsWrap.children).forEach(d=>d.classList.remove('on'));
    faceGlow.style.opacity = '0';
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playBtn.setAttribute('aria-label','開始');
    triggerHaptic(20);
  }

  playBtn.addEventListener('click', ()=>{
    if(isPlaying) stop(); else start();
  });

  // ---------- Keyboard Shortcuts ----------
  window.addEventListener('keydown', (e)=>{
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if(e.code === 'Space'){
      e.preventDefault();
      if(isPlaying) stop(); else start();
    } else if(e.code === 'ArrowUp'){
      e.preventDefault();
      setBpm(bpm + 1);
    } else if(e.code === 'ArrowDown'){
      e.preventDefault();
      setBpm(bpm - 1);
    }
  });

  // Audio unlock and visibility handling
  document.addEventListener('touchstart', ()=>{ ensureAudio(); }, {once:true, passive:true});
  document.addEventListener('click', ()=>{ ensureAudio(); }, {once:true});

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && isPlaying){
      stop();
    }
  });

})();

// Service worker registration (offline caching on GitHub Pages)
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
