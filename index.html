<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>高級木質節拍器</title>
<meta name="theme-color" content="#2B1810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
  :root{
    --wood-dark:#241309;
    --wood-mid:#402210;
    --wood-hi:#5a3018;
    --brass:#c9a467;
    --brass-light:#efd9a6;
    --ivory:#f5efe0;
    --ivory-dim:#cfc6ae;
    --accent-red:#a83d3d;
    --beat-glow:#e8b04b;
    --shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%; margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #4a2812 0%, transparent 60%),
      var(--wood-dark);
    color:var(--ivory);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  #app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
  }

  /* ---------- Header ---------- */
  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--brass);
    opacity:.75;
    margin-top:2px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:.02em;
    margin:2px 0 12px;
    color:var(--ivory);
  }

  /* ---------- Pendulum case ---------- */
  .case{
    position:relative;
    width:100%;
    max-width:240px;
    aspect-ratio: 3 / 4;
    background:
      linear-gradient(160deg, var(--wood-hi) 0%, var(--wood-mid) 55%, var(--wood-dark) 100%);
    border-radius: 18px 18px 70px 70px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.06),
      inset 0 -20px 40px rgba(0,0,0,.45),
      0 16px 30px var(--shadow);
    overflow:hidden;
    border:1px solid rgba(0,0,0,.5);
  }
  .case::before{ /* wood grain */
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 1px, transparent 1px, transparent 7px);
    mix-blend-mode:overlay;
    opacity:.5;
  }
  .case-face{
    position:absolute;
    top:10%; left:8%; right:8%; bottom:6%;
    background:
      radial-gradient(circle at 22% 18%, rgba(232,176,74,.16) 0%, transparent 45%),
      radial-gradient(circle at 82% 82%, rgba(168,61,61,.12) 0%, transparent 50%),
      linear-gradient(165deg, #f8f1dc 0%, #ecdfc0 50%, #e2d2a9 100%);
    border-radius: 10px 10px 50px 50px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.35), inset 0 0 0 2px rgba(0,0,0,.15);
    overflow:hidden;
  }
  .face-glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 32%, var(--beat-glow) 0%, transparent 62%);
    opacity:0;
    pointer-events:none;
    z-index:0;
    transition: opacity .12s ease-out;
  }
  .face-glow.accent{
    background: radial-gradient(circle at 50% 32%, var(--accent-red) 0%, transparent 62%);
  }

  .notes{ position:absolute; inset:0; z-index:1; }
  .note{
    position:absolute;
    font-size:30px;
    opacity:.55;
    pointer-events:none;
  }
  .note .note-inner{ display:inline-block; }
  .note.n1{ top:12%; left:14%; color:var(--brass); font-size:32px; }
  .note.n2{ top:64%; left:70%; color:var(--accent-red); font-size:34px; }
  .note.n3{ top:40%; left:76%; color:var(--beat-glow); font-size:26px; }
  .note.n4{ top:74%; left:15%; color:var(--brass); font-size:28px; }

  .scale{
    position:absolute; left:50%; top:8%; bottom:4%;
    width:2px; transform:translateX(-50%);
    z-index:1;
  }
  .tick{
    position:absolute; left:50%;
    width:1px; height:8px;
    background:rgba(80,60,30,.35);
    transform-origin:top center;
  }
  .tick.major{ height:12px; width:1.5px; background:rgba(80,60,30,.55);}

  .arm{
    position:absolute;
    left:50%; top:11%;
    width:4px; height:82%;
    background:linear-gradient(180deg, var(--brass) 0%, #8f7038 100%);
    border-radius:2px;
    transform-origin: top center;
    transform: translateX(-50%) rotate(0deg);
    box-shadow:0 0 4px rgba(0,0,0,.3);
  }
  .weight{
    position:absolute;
    left:50%; top:36%;
    width:22px; height:15px;
    background: radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 55%, #7a5e2c 100%);
    border-radius:4px;
    transform:translate(-50%,-50%);
    box-shadow:0 2px 5px rgba(0,0,0,.4);
    transition: top .15s ease;
  }
  .bob{
    position:absolute;
    left:50%; bottom:-3%;
    width:15px; height:15px;
    background: radial-gradient(circle at 35% 30%, var(--accent-red) 0%, #6e2626 100%);
    border-radius:50%;
    transform:translateX(-50%);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .pivot-cap{
    position:absolute; left:50%; top:11%;
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--ivory), #8a7a54);
    transform:translate(-50%,-50%);
    box-shadow:0 1px 3px rgba(0,0,0,.5);
    z-index:2;
  }

  .arm.swinging{ animation: swing linear infinite; }
  @keyframes swing{
    0%{ transform: translateX(-50%) rotate(-24deg); }
    50%{ transform: translateX(-50%) rotate(24deg); }
    100%{ transform: translateX(-50%) rotate(-24deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .arm.swinging{ animation: none; }
  }

  /* ---------- BPM readout ---------- */
  .bpm-wrap{
    display:flex; align-items:baseline; justify-content:center;
    gap:10px; margin-top:16px;
  }
  .bpm-btn{
    width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(201,164,103,.4);
    background:rgba(255,255,255,.03);
    color:var(--brass-light);
    font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .bpm-btn:active{ background:rgba(201,164,103,.2); transform:scale(.94); }
  
  .bpm-display-container{
    position:relative;
    text-align:center;
  }
  .bpm-num{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:54px;
    min-width:140px;
    text-align:center;
    letter-spacing:-.01em;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    border-bottom: 2px dashed rgba(201,164,103,0.4);
    transition: color 0.2s;
  }
  .bpm-num:hover{ color: var(--brass-light); }
  
  .bpm-input-field{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 42px;
    width: 130px;
    background: var(--wood-dark);
    color: var(--ivory);
    border: 2px solid var(--brass);
    border-radius: 8px;
    text-align: center;
    display: none;
    z-index: 10;
  }
  .bpm-input-field:focus { outline: none; }

  .bpm-label{
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--ivory-dim); text-align:center; margin-top:-2px;
  }

  input[type=range]{
    width:100%; margin-top:12px;
    -webkit-appearance:none; appearance:none;
    height:4px; border-radius:2px;
    background:rgba(255,255,255,.15);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass));
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    margin-top:-7px;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:2px;
  }

  /* ---------- Beat indicator ---------- */
  .beats{
    display:flex; gap:8px; margin-top:14px; min-height:16px; justify-content:center;
  }
  .beat-dot{
    width:12px; height:12px; border-radius:50%;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.15);
  }
  .beat-dot.accent{ border-color:rgba(232,176,74,.5); }
  .beat-dot.on{
    background:var(--beat-glow);
    box-shadow:0 0 10px var(--beat-glow);
    transform:scale(1.2);
  }
  .beat-dot.accent.on{
    background:var(--accent-red);
    box-shadow:0 0 12px var(--accent-red);
  }

  /* ---------- Controls row ---------- */
  .row{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-top:14px; width:100%;
    flex-wrap: wrap;
  }
  select{
    -webkit-appearance:none; appearance:none;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(201,164,103,.35);
    color:var(--ivory);
    padding:8px 12px; border-radius:8px;
    font-size:13px;
  }
  .tap-btn{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(201,164,103,.35);
    color:var(--ivory);
    padding:8px 14px; border-radius:8px;
    font-size:13px; cursor:pointer;
  }
  .tap-btn:active{ background:rgba(201,164,103,.2); }

  .main-ctrl-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 16px;
  }

  .timer-display{
    margin-top:10px;
    font-variant-numeric: tabular-nums;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--brass-light);
    opacity:0;
    height:0;
    overflow:hidden;
    transition: opacity .2s ease;
  }
  .timer-display.active{
    opacity:1;
    height:auto;
  }
  .timer-display.ending{
    color:var(--accent-red);
  }

  .play-btn{
    width:72px; height:72px; border-radius:50%;
    border:none;
    background: radial-gradient(circle at 35% 30%, var(--accent-red) 0%, #6e2626 70%);
    box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .play-btn:active{ transform:scale(.96); }
  .play-btn svg{ width:26px; height:26px; fill:var(--ivory); }

  .vol-row{
    display:flex; align-items:center; gap:10px;
    width:100%; margin-top:14px; opacity:.85;
  }
  .vol-row svg{ width:15px; height:15px; fill:var(--ivory-dim); flex-shrink:0; }
  .vol-row input{ margin-top:0; }

  .song-btn{
    border:1px solid var(--brass);
    background:rgba(201,164,103,.12);
    color:var(--brass-light);
    border-radius:999px;
    padding:10px 16px;
    font-size:14px; letter-spacing:.06em;
    cursor:pointer;
  }
  .song-btn[hidden]{ display:none; }
  .song-btn.playing{ background:var(--brass); color:#241309; font-weight:700; }
  .app-version{
    margin-top:4px; font-size:11px; opacity:.4; letter-spacing:.08em;
  }
  .update-bar{
    position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translate(-50%, 160%);
    width:min(92vw, 420px);
    display:flex; align-items:center; gap:10px;
    padding:12px 12px 12px 16px;
    background:rgba(36,19,9,.96);
    border:1px solid var(--brass);
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
    color:var(--ivory, #f5efe0);
    z-index:50;
    transition:transform .35s ease;
  }
  .update-bar.show{ transform:translate(-50%, 0); }
  .update-text{ flex:1; display:flex; flex-direction:column; gap:2px; font-size:13px; line-height:1.4; }
  .update-text strong{ color:var(--brass-light); font-size:14px; }
  .update-text span{ opacity:.8; }
  #updateBtn{
    border:none; border-radius:10px; padding:9px 14px;
    background:var(--brass); color:#241309; font-weight:700; font-size:14px; cursor:pointer;
  }
  #updateLater{
    border:none; background:none; color:inherit; opacity:.6; font-size:16px; padding:6px; cursor:pointer;
  }
  @media (prefers-reduced-motion: reduce){ .update-bar{ transition:none; } }
  footer.hint{ color:var(--brass-light, #e0c48a); opacity:1; }
  footer{
    margin-top:auto;
    padding-top:16px;
    font-size:10px;
    letter-spacing:.1em;
    color:rgba(245,239,224,.3);
    text-align:center;
  }
</style>
</head>
<body>
<div id="app">
  <div class="eyebrow">METRONOME · 節拍器</div>
  <h1>精緻木質節拍器</h1>

  <div class="case">
    <div class="case-face">
      <div class="face-glow" id="faceGlow"></div>
      <div class="notes">
        <span class="note n1" id="note1"><span class="note-inner">♪</span></span>
        <span class="note n2" id="note2"><span class="note-inner">♫</span></span>
        <span class="note n3" id="note3"><span class="note-inner">♬</span></span>
        <span class="note n4" id="note4"><span class="note-inner">♩</span></span>
      </div>
      <div class="scale" id="scale"></div>
    </div>
    <div class="arm" id="arm">
      <div class="weight" id="weight"></div>
      <div class="bob"></div>
    </div>
    <div class="pivot-cap"></div>
  </div>

  <div class="bpm-wrap">
    <div class="bpm-btn" id="bpmDown">–</div>
    <div class="bpm-display-container">
      <div class="bpm-num" id="bpmNum" title="點擊直接輸入數字">120</div>
      <input type="tel" id="bpmInput" class="bpm-input-field" min="40" max="240" value="120" inputmode="numeric" pattern="[0-9]*" aria-label="輸入 BPM 數值">
      <div class="bpm-label">BPM</div>
    </div>
    <div class="bpm-btn" id="bpmUp">+</div>
  </div>

  <input type="range" id="bpmSlider" min="40" max="240" value="120">

  <div class="beats" id="beats"></div>

  <div class="row">
    <select id="beatsPerBar" aria-label="拍號選擇">
      <option value="2">2/4 拍</option>
      <option value="3">3/4 拍</option>
      <option value="4" selected>4/4 拍</option>
      <option value="6">6/8 拍</option>
    </select>
    <select id="soundStyle" aria-label="音色選擇">
      <option value="wood" selected>木魚音色</option>
      <option value="beep">電子嗶聲</option>
      <option value="bell">清脆鈴音</option>
      <option value="guzheng">古箏撥弦</option>
    </select>
    <select id="timerSelect" aria-label="定時練習時長">
      <option value="0" selected>不限時</option>
      <option value="300">5 分鐘</option>
      <option value="600">10 分鐘</option>
      <option value="900">15 分鐘</option>
      <option value="1200">20 分鐘</option>
      <option value="1800">30 分鐘</option>
    </select>
    <button class="tap-btn" id="tapBtn">點按抓拍</button>
  </div>

  <div class="timer-display" id="timerDisplay"></div>

  <div class="main-ctrl-row">
    <button class="play-btn" id="playBtn" aria-label="開始/暫停">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="song-btn" id="songBtn" type="button" hidden aria-label="古箏演奏一曲">🎵 彈一曲</button>
  </div>

  <div class="vol-row">
    <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" id="volSlider" min="0" max="100" value="70">
  </div>

  <footer>進階觸控版 · 支援空白鍵與方向鍵操作</footer>
  <div class="app-version" id="appVersion"></div>
</div>

<div class="update-bar" id="updateBar" role="status" aria-live="polite">
  <div class="update-text">
    <strong>有新版本可以更新</strong>
    <span id="updateNotes"></span>
  </div>
  <button type="button" id="updateBtn">立即更新</button>
  <button type="button" id="updateLater" aria-label="稍後再說">✕</button>
</div>

<script>
(function(){
  "use strict";

  // ---------- State ----------
  let bpm = 120;
  let beatsPerBar = 4;
  let isPlaying = false;
  let volume = 0.7;
  let currentBeat = 0;
  let soundStyle = 'wood'; // 'wood', 'beep', 'bell'
  let timerDuration = 0; // seconds; 0 = unlimited
  let timerRemaining = 0;
  let timerIntervalId = null;

  // ---------- Elements ----------
  const bpmNum = document.getElementById('bpmNum');
  const bpmInput = document.getElementById('bpmInput');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmDown = document.getElementById('bpmDown');
  const bpmUp = document.getElementById('bpmUp');
  const beatsSelect = document.getElementById('beatsPerBar');
  const soundSelect = document.getElementById('soundStyle');
  const timerSelect = document.getElementById('timerSelect');
  const timerDisplay = document.getElementById('timerDisplay');
  const songBtn = document.getElementById('songBtn');
  const tapBtn = document.getElementById('tapBtn');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const arm = document.getElementById('arm');
  const weight = document.getElementById('weight');
  const beatsWrap = document.getElementById('beats');
  const volSlider = document.getElementById('volSlider');
  const scaleEl = document.getElementById('scale');
  const faceGlow = document.getElementById('faceGlow');
  const notes = document.querySelectorAll('.note');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Haptic helper ----------
  function triggerHaptic(duration = 10){
    if(navigator.vibrate){
      try { navigator.vibrate(duration); } catch(e){}
    }
  }

  // ---------- Persisted settings ----------
  try{
    const saved = JSON.parse(localStorage.getItem('metronome-advanced-settings') || '{}');
    if(saved.bpm) bpm = saved.bpm;
    if(saved.beatsPerBar) beatsPerBar = saved.beatsPerBar;
    if(typeof saved.volume === 'number') volume = saved.volume;
    if(saved.soundStyle) soundStyle = saved.soundStyle;
    if(typeof saved.timerDuration === 'number') timerDuration = saved.timerDuration;
  }catch(e){}

  function saveSettings(){
    try{
      localStorage.setItem('metronome-advanced-settings', JSON.stringify({bpm, beatsPerBar, volume, soundStyle, timerDuration}));
    }catch(e){}
  }

  // ---------- Scale ticks ----------
  (function buildScale(){
    const positions = [10,20,30,40,50,60,70,80,90];
    positions.forEach((p,i)=>{
      const t = document.createElement('div');
      t.className = 'tick' + (i % 2 === 0 ? ' major' : '');
      t.style.top = p + '%';
      scaleEl.appendChild(t);
    });
  })();

  // ---------- Beat dots ----------
  function buildBeatDots(){
    beatsWrap.innerHTML = '';
    for(let i=0;i<beatsPerBar;i++){
      const d = document.createElement('div');
      d.className = 'beat-dot' + (i===0 ? ' accent' : '');
      beatsWrap.appendChild(d);
    }
  }
  buildBeatDots();

  let noteIndex = 0;
  function lightBeat(idx){
    const dots = beatsWrap.children;
    Array.from(dots).forEach(d=>d.classList.remove('on'));
    if(dots[idx]) dots[idx].classList.add('on');

    const accent = idx === 0;
    faceGlow.classList.toggle('accent', accent);
    faceGlow.style.opacity = accent ? '0.6' : '0.3';
    setTimeout(()=>{ faceGlow.style.opacity = '0'; }, 80);

    // Use Web Animations API instead of forcing offsetWidth reflow
    const note = notes[noteIndex % notes.length];
    noteIndex++;
    if(note.animate && !prefersReducedMotion){
      note.animate([
        { transform: 'scale(1) translateY(0)', opacity: 0.55 },
        { transform: 'scale(1.8) translateY(-16px)', opacity: 1 },
        { transform: 'scale(1) translateY(0)', opacity: 0.55 }
      ], { duration: 400, easing: 'ease-out' });
    }
  }

  // ---------- UI sync ----------
  function updateBpmUI(){
    bpmNum.textContent = bpm;
    bpmInput.value = bpm;
    bpmSlider.value = bpm;
    const cycleSeconds = (60 / bpm) * 2;
    arm.style.animationDuration = cycleSeconds + 's';
    const t = (bpm - 40) / (240 - 40);
    weight.style.top = (25 + (1-t) * 35) + '%';
  }
  updateBpmUI();
  beatsSelect.value = String(beatsPerBar);
  soundSelect.value = soundStyle;
  timerSelect.value = String(timerDuration);
  volSlider.value = Math.round(volume*100);

  function setBpm(newBpm){
    bpm = Math.max(40, Math.min(240, Math.round(newBpm)));
    updateBpmUI();
    if(isPlaying) restartScheduler();
    saveSettings();
  }

  // Direct BPM text input handling
  bpmNum.addEventListener('click', ()=>{
    bpmInput.style.display = 'block';
    bpmInput.focus();
    bpmInput.select();
  });

  bpmInput.addEventListener('blur', ()=>{
    finishBpmInput();
  });

  bpmInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      finishBpmInput();
    }
  });

  function finishBpmInput(){
    const val = parseInt(bpmInput.value, 10);
    if(!isNaN(val)){
      setBpm(val);
    }

  // ---------- Tap tempo ----------
  let tapTimes = [];
  tapBtn.addEventListener('click', ()=>{
    triggerHaptic(15);
    const now = performance.now();
    tapTimes = tapTimes.filter(t => now - t < 2200);
    tapTimes.push(now);
    if(tapTimes.length >= 2){
      const intervals = [];
      for(let i=1;i<tapTimes.length;i++) intervals.push(tapTimes[i]-tapTimes[i-1]);
      const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      const newBpm = 60000/avg;
      setBpm(newBpm);

    clearTimeout(tapBtn._t);
    tapBtn._t = setTimeout(()=>{ tapBtn.textContent = '點按抓拍'; }, 1200);

  // ---------- Audio (Web Audio scheduler) ----------
  let audioCtx = null;
  let nextNoteTime = 0;
  let schedulerTimer = null;
  let schedAheadTime = 0.1;
  let lookaheadMs = 25;
  let beatInScheduler = 0;

  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    // iOS 17+：設為 playback，靜音開關打開時節拍聲仍會出聲
    try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
    // iOS：來電、Siri 等中斷後狀態會是 'interrupted'，同樣需要 resume
    if(audioCtx.state !== 'running'){
      audioCtx.resume().catch(()=>{});
    }
  }

  // ---------- 古箏：Karplus-Strong 撥弦合成（每個音高只算一次並快取） ----------
  // 古箏常用 D 調五聲音階：重拍 D5、一般拍 A4
  const GUZHENG_NOTES = { accent: 587.33, normal: 440.00 };
  const pluckCache = {};

  function makePluckBuffer(freq){
    const sr = audioCtx.sampleRate;
    const dur = 1.6;
    const len = Math.floor(sr * dur);
    const buf = audioCtx.createBuffer(1, len, sr);
    const out = buf.getChannelData(0);
    const N = Math.max(2, Math.round(sr / freq));
    // 初始激發：雜訊 + 輕微平滑，模擬指甲（義甲）撥弦偏亮的音色
    const ring = new Float32Array(N);
    let prev = 0;
    for(let i=0;i<N;i++){
      const r = Math.random()*2 - 1;
      prev = prev*0.35 + r*0.65;
      ring[i] = prev;
    }
    const decay = 0.9965;
    let idx = 0;
    for(let i=0;i<len;i++){
      const a = ring[idx];
      const b = ring[(idx+1) % N];
      out[i] = a;
      ring[idx] = decay * 0.5 * (a + b);
      idx = (idx+1) % N;
    }
    // 正規化並在尾端淡出
    let peak = 0;
    for(let i=0;i<len;i++) peak = Math.max(peak, Math.abs(out[i]));
    const fadeStart = Math.floor(len*0.8);
    for(let i=0;i<len;i++){
      let g = peak ? 0.9/peak : 1;
      if(i > fadeStart) g *= 1 - (i - fadeStart)/(len - fadeStart);
      out[i] *= g;
    }
    // Karplus-Strong 的實際音高 = sr/(N+0.5)，回傳修正倍率讓音準正確
    return { buf, rate: freq / (sr / (N + 0.5)) };
  }

  function getPluck(freq){
    const key = freq.toFixed(2);
    if(!pluckCache[key]) pluckCache[key] = makePluckBuffer(freq);
    return pluckCache[key];
  }

  // 撥一根弦：freq 音高、vol 音量；opts.bend 上滑音幅度（例如 0.03 = 從低 3% 滑上來）
  // opts.bright 亮度、opts.ring 餘音長度（秒）；回傳 source 以便中途停止
  function playPluck(freq, time, vol, opts){
    opts = opts || {};
    const p = getPluck(freq);
    const src = audioCtx.createBufferSource();
    src.buffer = p.buf;
    if(opts.bend){
      src.playbackRate.setValueAtTime(p.rate * (1 - opts.bend), time);
      src.playbackRate.linearRampToValueAtTime(p.rate, time + (opts.bendTime || 0.09));
    } else {
      src.playbackRate.setValueAtTime(p.rate, time);
    }
    // 琴身共鳴：低通柔化 + 中低頻微微增厚
    const tone = audioCtx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.setValueAtTime(opts.bright || 4600, time);
    const body = audioCtx.createBiquadFilter();
    body.type = 'peaking';
    body.frequency.value = 320;
    body.Q.value = 1.2;
    body.gain.value = 4;
    const gain = audioCtx.createGain();
    const ring = opts.ring || 0.6;
    gain.gain.setValueAtTime(vol, time);
    gain.gain.setTargetAtTime(0.0001, time + ring, 0.25);
    src.connect(tone); tone.connect(body); body.connect(gain); gain.connect(audioCtx.destination);
    src.start(time);
    src.stop(time + 1.6);
    return src;
  }

  function playGuzheng(time, accent, vol){
    // 重拍加一點「上滑音」，模擬古箏按弦的韻味
    playPluck(accent ? GUZHENG_NOTES.accent : GUZHENG_NOTES.normal, time,
      vol * (accent ? 1.0 : 0.85),
      { bend: accent ? 0.03 : 0, bright: accent ? 5200 : 4200 });
  }

  // ---------- 古箏小曲《竹林踏歌》（原創，D 調五聲音階，2/4 拍） ----------
  // 簡譜 1=D：1 D5、2 E5、3 F#5、5 A5、6 B5；加 ' 為高八度、加 , 為低八度；0 為休止
  // 每個音 [音名, 拍數]；音名後加 ~ 表示上滑音
  const PITCH = {
    "5,":440.00, "6,":493.88,
    "1":587.33, "2":659.26, "3":739.99, "5":880.00, "6":987.77,
    "1'":1174.66, "2'":1318.51, "3'":1479.98
  };
  const BASS = { A3:220.00, B3:246.94, D4:293.66, E4:329.63, "F#4":369.99, A4:440.00, B4:493.88 };
  const FIFTH = { D4:'A4', A3:'E4', B3:'F#4', E4:'B4' };

  const SECTION_A = [
    { bass:'D4', m:[['5',.5],['6',.5],["1'",.5],['6',.5]] },
    { bass:'A3', m:[['5',.5],['3',.5],['2',.5],['3',.5]] },
    { bass:'D4', m:[['5',.5],['3',.25],['5',.25],['6',.5],['5',.5]] },
    { bass:'A3', m:[['2~',1.5],['0',.5]] },
    { bass:'D4', m:[['1',.5],['2',.5],['3',.5],['5',.5]] },
    { bass:'B3', m:[['6',.5],['5',.5],['3',.5],['5',.5]] },
    { bass:'A3', m:[['2',.5],['3',.25],['2',.25],['1',.5],['6,',.5]] },
    { bass:'D4', m:[['1~',1.5],['0',.5]] }
  ];
  const SECTION_B = [
    { bass:'D4', m:[["1'",.5],["1'",.5],['6',.5],["1'",.5]] },
    { bass:'B3', m:[["2'",.5],["1'",.5],['6',.5],['5',.5]] },
    { bass:'B3', m:[['6',.25],['6',.25],['5',.5],['6',.5],["1'",.5]] },
    { bass:'D4', m:[["1'~",1.5],['0',.5]] },
    { bass:'A3', m:[['5',.5],['6',.5],['5',.5],['3',.5]] },
    { bass:'E4', m:[['2',.5],['3',.5],['5',.5],['6',.5]] },
    { bass:'A3', m:[['5',.5],['3',.25],['2',.25],['3',.5],['2',.5]] },
    { bass:'A3', m:[['2',.5],['3',.5],['5',.5],['6',.5]] }
  ];
  // 結尾段：A 段前七小節 + 收尾
  const SECTION_END = SECTION_A.slice(0, 7).concat([
    { bass:'D4', m:[['1',2]], end:true }
  ]);
  const SONG = SECTION_A.concat(SECTION_B, SECTION_END);
  const SONG_BEATS_PER_BAR = 2;

  // 刮奏：沿五聲音階快速掃弦（古箏招牌技巧）
  const GLISS_UP = ["5,","6,","1","2","3","5","6","1'","2'","3'"];
  let songPlaying = false;
  let songSources = [];
  let songTimers = [];
  let songEndTimer = null;

  function playAccentPing(time){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2637, time); // E7, sits above every style's base tone
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(Math.max(volume, 0.001) * 0.35, time + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.09);
  }

  function playSound(time, accent){
    if(volume <= 0) return;
    const effectiveVol = Math.max(volume, 0.001);

    if(accent && soundStyle !== 'guzheng') playAccentPing(time);

    if(soundStyle === 'guzheng'){
      playGuzheng(time, accent, effectiveVol);

    } else if(soundStyle === 'wood'){
      // Woodblock sound simulation using filtered noise/sine combo or high-Q oscillators
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(accent ? 880 : 660, time);
      osc.frequency.exponentialRampToValueAtTime(120, time + 0.03);
      
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(effectiveVol, time + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.05);

    } else if(soundStyle === 'bell'){
      // Bell sound
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(accent ? 2093 : 1567, time); // C7 or G6
      
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(effectiveVol * 0.8, time + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.16);

    } else {
      // Classic Beep
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = accent ? 1500 : 1000;
      
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(effectiveVol, time + 0.001);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.06);
    }
  }

  function scheduleNote(beatIndex, time){
    playSound(time, beatIndex === 0);
    const delay = (time - audioCtx.currentTime) * 1000;
    setTimeout(()=>{
      currentBeat = beatIndex;
      lightBeat(beatIndex);
    }, Math.max(0, delay));
  }

  function scheduler(){
    while(nextNoteTime < audioCtx.currentTime + schedAheadTime){
      scheduleNote(beatInScheduler, nextNoteTime);
      const secondsPerBeat = 60.0 / bpm;
      nextNoteTime += secondsPerBeat;
      beatInScheduler = (beatInScheduler + 1) % beatsPerBar;
    }
    schedulerTimer = setTimeout(scheduler, lookaheadMs);
  }

  function startScheduler(){
    ensureAudio();
    beatInScheduler = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
  }

  function stopScheduler(){
    clearTimeout(schedulerTimer);
    schedulerTimer = null;
  }

  function restartScheduler(){
    stopScheduler();
    startScheduler();
  }

  // ---------- 古箏演奏 ----------
  function startSong(){
    if(isPlaying) stop();
    ensureAudio();
    songPlaying = true;
    songSources = [];
    songTimers = [];
    const vol = Math.max(volume, 0.001);
    const spb = 60 / bpm;                 // 一拍幾秒（跟著目前 BPM）
    const t0 = audioCtx.currentTime + 0.08;

    // 開場刮奏
    let t = t0;
    GLISS_UP.forEach((n, i)=>{
      songSources.push(playPluck(PITCH[n], t + i*0.035, vol*(0.4 + 0.4*i/GLISS_UP.length), { ring:0.3 }));
    });
    t += GLISS_UP.length*0.035 + spb*0.5;

    let beatCount = 0;
    SONG.forEach(bar=>{
      // 左手低音：第一拍根音、第二拍五度
      songSources.push(playPluck(BASS[bar.bass], t, vol*0.55, { bright:2600, ring: bar.end ? 1.4 : 0.5 }));
      if(!bar.end) songSources.push(playPluck(BASS[FIFTH[bar.bass]], t + spb, vol*0.4, { bright:2600, ring:0.4 }));
      // 右手旋律
      let mt = t;
      bar.m.forEach(([name, beats])=>{
        if(name !== '0'){
          const slide = name.endsWith('~');
          const key = slide ? name.slice(0,-1) : name;
          const onBeat = Math.abs((mt - t) % spb) < 1e-6;
          songSources.push(playPluck(PITCH[key], mt, vol*(onBeat ? 0.95 : 0.78), {
            bend: slide ? 0.06 : 0, bendTime: slide ? 0.14 : 0.09,
            bright: onBeat ? 5200 : 4400,
            ring: Math.max(0.25, beats*spb*0.9)
          }));
        }
        mt += beats * spb;
      });
      // 畫面拍點跟著亮
      for(let b=0;b<SONG_BEATS_PER_BAR;b++){
        const when = t + b*spb;
        const idx = beatCount % beatsPerBar;
        songTimers.push(setTimeout(()=>{ if(songPlaying) lightBeat(idx); }, Math.max(0,(when - audioCtx.currentTime)*1000)));
        beatCount++;
      }
      t += SONG_BEATS_PER_BAR * spb;
    });
    // 結尾：最後一個音後再刮奏一次收尾
    const endAt = t - spb*2 + spb*0.02;
    [...GLISS_UP].reverse().forEach((n, i)=>{
      songSources.push(playPluck(PITCH[n], endAt + 0.01 + i*0.03, vol*0.35, { ring:0.3 }));
    });

    arm.classList.add('swinging');
    songBtn.classList.add('playing');
    songBtn.textContent = '■ 停止';
    requestWakeLock();
    setFooterHint('');
    songEndTimer = setTimeout(()=>stopSong(true), (t - audioCtx.currentTime + 1.2)*1000);
    triggerHaptic(20);
  }

  function stopSong(naturalEnd){
    if(!songPlaying) return;
    songPlaying = false;
    clearTimeout(songEndTimer);
    songTimers.forEach(clearTimeout);
    songTimers = [];
    if(!naturalEnd){
      songSources.forEach(src=>{ try{ src.stop(); }catch(e){} });
    }
    songSources = [];
    releaseWakeLock();
    arm.classList.remove('swinging');
    arm.style.transform = 'translateX(-50%) rotate(0deg)';
    Array.from(beatsWrap.children).forEach(d=>d.classList.remove('on'));
    songBtn.classList.remove('playing');
    songBtn.textContent = '🎵 彈一曲';
  }

  function updateSongBtn(){
    const show = soundStyle === 'guzheng';
    songBtn.hidden = !show;
    if(!show) stopSong();
  }

  songBtn.addEventListener('click', ()=>{
    if(songPlaying) stopSong(); else startSong();
  });
  updateSongBtn();

  // ---------- Practice timer ----------
  function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateTimerDisplay(){
    timerDisplay.textContent = '剩餘時間 ' + formatTime(timerRemaining);
    timerDisplay.classList.toggle('ending', timerRemaining <= 10);
  }

  async function requestWakeLock(){
    if('wakeLock' in navigator){
      try{
        if(wakeLock && !wakeLock.released) return;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
        return;
      }catch(e){
        // iOS 18.4 以前的主畫面 PWA 會在這裡失敗，改用備援
      }
    }
    try{ await getNoSleepVideo().play(); }catch(e){}
  }

  function releaseWakeLock(){
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
    if(noSleepVideo){ noSleepVideo.pause(); }
  }

  function startTimer(){
    if(timerDuration <= 0) return;
    timerRemaining = timerDuration;
    timerEndAt = Date.now() + timerDuration * 1000;
    updateTimerDisplay();
    timerDisplay.classList.add('active');
    clearInterval(timerIntervalId);
    // 以結束時間戳計算剩餘秒數，避免 setInterval 被節流造成累積誤差
    timerIntervalId = setInterval(()=>{
      timerRemaining = Math.max(0, Math.ceil((timerEndAt - Date.now()) / 1000));
      if(timerRemaining <= 0){
        stop();
        triggerHaptic(40);
        return;
      }
      updateTimerDisplay();
    }, 250);
  }

  function stopTimer(){
    clearInterval(timerIntervalId);
    timerIntervalId = null;
    timerDisplay.classList.remove('active','ending');
  }

  // ---------- Play / stop ----------
  function start(){
    stopSong();
    isPlaying = true;
    ensureAudio();
    requestWakeLock();
    setFooterHint('');
    startScheduler();
    startTimer();
    arm.classList.add('swinging');
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    playBtn.setAttribute('aria-label','暫停');
    triggerHaptic(20);
  }

  function stop(){
    isPlaying = false;
    releaseWakeLock();
    stopScheduler();
    stopTimer();
    arm.classList.remove('swinging');
    arm.style.transform = 'translateX(-50%) rotate(0deg)';
    Array.from(beatsWrap.children).forEach(d=>d.classList.remove('on'));
    faceGlow.style.opacity = '0';
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playBtn.setAttribute('aria-label','開始');
    triggerHaptic(20);
  }

  playBtn.addEventListener('click', ()=>{
    if(isPlaying) stop(); else start();
  });

  // ---------- Keyboard Shortcuts ----------
  window.addEventListener('keydown', (e)=>{
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if(e.code === 'Space'){
      e.preventDefault();
      if(isPlaying) stop(); else start();
    } else if(e.code === 'ArrowUp'){
      e.preventDefault();
      setBpm(bpm + 1);
    } else if(e.code === 'ArrowDown'){
      e.preventDefault();
      setBpm(bpm - 1);
    }
  });

  // Audio unlock and visibility handling
  document.addEventListener('touchstart', ()=>{ ensureAudio(); }, {once:true, passive:true});
  document.addEventListener('click', ()=>{ ensureAudio(); }, {once:true});

  const footerEl = document.querySelector('footer');
  const footerDefault = footerEl ? footerEl.textContent : '';
  function setFooterHint(msg){
    if(!footerEl) return;
    footerEl.textContent = msg || footerDefault;
    footerEl.classList.toggle('hint', !!msg);
  }

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){
      if(songPlaying) stopSong();
      if(isPlaying){
        // 背景中 iOS 會凍結計時器與音訊，停止以免回來時拍子亂跳
        stop();
        setFooterHint('螢幕關閉或切到背景，已自動暫停 · 點播放鍵繼續');
      }
    } else if(isPlaying){
      // 回到前景時 Wake Lock 已被系統釋放，重新取得
      requestWakeLock();
    }
  });

})();

// ---------- 版本與自動更新通知 ----------
var APP_VERSION = '1.4.0';
(function(){
  var verEl = document.getElementById('appVersion');
  if(verEl) verEl.textContent = 'v' + APP_VERSION;

  if(!('serviceWorker' in navigator)) return;

  var bar = document.getElementById('updateBar');
  var notesEl = document.getElementById('updateNotes');
  var btn = document.getElementById('updateBtn');
  var later = document.getElementById('updateLater');
  var waitingWorker = null;
  var refreshing = false;

  function askVersion(worker){
    // 向新版 Service Worker 詢問版本號與更新內容
    return new Promise(function(resolve){
      try{
        var ch = new MessageChannel();
        var done = false;
        ch.port1.onmessage = function(e){ done = true; resolve(e.data || {}); };
        worker.postMessage({type:'GET_VERSION'}, [ch.port2]);
        setTimeout(function(){ if(!done) resolve({}); }, 1500);
      }catch(e){ resolve({}); }
    });
  }

  function showUpdate(worker){
    waitingWorker = worker;
    askVersion(worker).then(function(info){
      var txt = info.version ? ('v' + APP_VERSION + ' → v' + info.version) : '';
      if(info.notes) txt += (txt ? '：' : '') + info.notes;
      notesEl.textContent = txt || '點「立即更新」載入最新版';
      bar.classList.add('show');
    });
  }

  btn.addEventListener('click', function(){
    if(!waitingWorker) return;
    btn.disabled = true;
    btn.textContent = '更新中…';
    waitingWorker.postMessage({type:'SKIP_WAITING'});
  });
  later.addEventListener('click', function(){ bar.classList.remove('show'); });

  // 新版接手後自動重新整理一次
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(refreshing) return;
    refreshing = true;
    location.reload();
  });

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      // 已有等待中的新版（例如上次開啟時就下載好了）
      if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);

      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          // 有舊版控制頁面時才算「更新」；第一次安裝不提示
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            showUpdate(nw);
          }
        });
      });

      // 開啟時、回到前景時、每 30 分鐘檢查一次是否有新版
      function check(){ reg.update().catch(function(){}); }
      check();
      document.addEventListener('visibilitychange', function(){
        if(!document.hidden) check();
      });
      setInterval(check, 30 * 60 * 1000);
    }).catch(function(err){
      console.warn('Service worker registration failed:', err);
    });
  });
})();
</script>
